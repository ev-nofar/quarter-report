<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0}</style></head><body>
<title>מצגת רבעון 9.26</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f5f4fa; --surface:#ffffff; --fg:#1d1b2b; --muted:#6e6a85; --line:#e9e7f1;
  --brand:#6A4BFF; --brand-ink:#5B3CF5; --brand-2:#FFC600; --on-brand-2:#1d1b2b;
  --grad:linear-gradient(125deg,#5B3CF5 0%,#7A5CFF 55%,#9C87FF 100%);
  --tint:#f3f0ff; --cur:#fff5d1; --soft:rgba(106,75,255,.07); --bar:#7A5CFF; --neg:#c2410c;
  --font:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121019; --surface:#1b1924; --fg:#ecebf3; --muted:#9b97b0; --line:#2c2a38;
    --brand-ink:#a493ff; --tint:#25204a; --cur:#3a3110; --soft:rgba(164,147,255,.08); --bar:#8b77ff; --neg:#fb923c; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#121019; --surface:#1b1924; --fg:#ecebf3; --muted:#9b97b0; --line:#2c2a38;
  --brand-ink:#a493ff; --tint:#25204a; --cur:#3a3110; --soft:rgba(164,147,255,.08); --bar:#8b77ff; --neg:#fb923c; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;direction:rtl}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{background:var(--grad);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding-block:96px 34px;display:grid;gap:22px}
.hero .logo{position:absolute;left:28px;top:30px;z-index:2;height:50px;width:auto;display:block}
.hero h1{margin:0;font-size:clamp(34px,5.5vw,56px);font-weight:800;line-height:1}
.hero .q{margin-top:12px;display:flex;align-items:center;gap:14px;font-size:21px;font-weight:300}
.hero .q i{width:52px;height:6px;border-radius:3px;background:var(--brand-2);display:block}
.hero .big{position:absolute;left:-10px;bottom:-110px;font-size:300px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.85);direction:ltr;pointer-events:none;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(255,214,90,.9)) drop-shadow(0 0 40px rgba(255,198,0,.6))}
.hero .big{animation:q3 9s ease-in-out 1.5s infinite;transform-origin:30% 70%}
@keyframes q3{0%,14%,100%{transform:translateY(0) rotate(0);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(255,214,90,.9)) drop-shadow(0 0 40px rgba(255,198,0,.6))}
  7%{transform:translateY(-14px) rotate(-3deg);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px rgba(255,198,0,1)) drop-shadow(0 0 56px rgba(255,198,0,.8))}}
@media (prefers-reduced-motion: reduce){.hero .big{animation:none}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:18px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:8px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-current="page"]{background:#fff;color:var(--brand);border-color:#fff;font-weight:600}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
main.wrap{padding-block:28px 56px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
main.wrap>*{min-width:0}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
section h2{margin:0;padding:22px 24px 18px;font-size:26px;font-weight:700;color:var(--brand-ink);display:flex;align-items:center;gap:12px}
section h2::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--grad)}
section h2 small{font-size:18px;font-weight:400;color:var(--muted)}
.scroll{overflow-x:auto;padding:0 12px 12px}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
table.fs{min-width:1100px}
th{background:var(--brand);color:#fff;font-weight:600;font-size:18px;text-align:left;padding:12px 18px;white-space:nowrap;direction:rtl}
th:first-child{text-align:right}
th.grp{font-weight:700;text-align:center;border-radius:8px 8px 0 0}
th.cur{background:var(--brand-2);color:var(--on-brand-2)}
th.gap,td.gap{background:transparent!important;border:0!important;width:28px;min-width:28px;padding:0}
table.two thead tr:first-child th:not(.grp){background:transparent}
td{padding:12px 18px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:18px;direction:ltr}
td:first-child{text-align:right;white-space:normal;min-width:280px;direction:rtl}
td.cur{background:var(--cur);font-weight:600}
td.cmp{color:var(--fg)}
tr.total td:not(.gap){background:var(--tint);font-weight:700;border-bottom-color:transparent}
tr.total td:first-child{color:var(--brand-ink)}
tr.total td.cur{background:var(--cur)}
tr.key td:not(.gap){background:var(--brand);color:#fff;font-weight:700}
tr.key td.cur{background:var(--brand-2);color:var(--on-brand-2)}
tr.sp td{padding:5px;border:0}
tr.drill{cursor:pointer}
tr.drill:hover td:not(.gap){background:var(--soft)}
tr.drill:focus-visible{outline:2px solid var(--brand-ink);outline-offset:-2px}
tr.drill .car{display:inline-block;width:0;height:0;margin-inline-end:10px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid var(--brand-ink);transition:transform .15s;vertical-align:middle}
tr.drill[aria-expanded="true"] .car{transform:rotate(-90deg)}
tr.det td:not(.gap){font-size:17px;background:var(--soft)}
tr.det td.cur{background:var(--cur)}
tr.det td:first-child span{display:inline-block;padding-inline-start:26px}
tr.det.ds td:first-child span{padding-inline-start:46px}
tr.det.dg td{font-weight:700}
a.lnk{color:inherit;text-decoration:none;border-bottom:1px dashed currentColor}
a.lnk:hover{color:var(--brand-ink)}
a.lnk:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:3px}
.comps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.comp table td{padding:12px 18px}
.comp .bar{display:block;height:6px;border-radius:3px;background:var(--bar);margin-top:6px;opacity:.85}
.comp .bar.neg{background:var(--neg)}
.comp td.p{color:var(--muted);font-size:16px;width:72px}
.comp tr.g td{font-weight:700;color:var(--brand-ink);background:var(--soft)}
.comp tr.g2 td:first-child{padding-inline-start:30px}
.comp .tot{display:flex;justify-content:space-between;align-items:baseline;padding:0 22px 14px;color:var(--muted)}
.comp .tot b{font-size:30px;color:var(--fg);direction:ltr;font-variant-numeric:tabular-nums}
.sub{display:inline-block;padding-inline-start:18px;position:relative}
.sub::before{content:"";position:absolute;right:4px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--brand-ink);opacity:.45;transform:translateY(-50%)}
.pct{display:inline-block;min-width:4.2em;margin-inline-start:10px;padding:2px 7px;border-radius:6px;font-size:15px;font-weight:600;background:var(--soft);color:var(--brand-ink);text-align:center}
tr.key .pct{background:rgba(255,255,255,.2);color:inherit}
tr.seg td:first-child{font-weight:700;color:var(--brand-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.tile .k{color:var(--muted)}
.tile .v{font-size:34px;font-weight:700;margin-top:6px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.tile .s{color:var(--muted);font-size:17px;margin-top:2px}
.tile.cur{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
@media (max-width:820px){.comps,.tiles{grid-template-columns:1fr}.hero .logo{left:16px;top:20px;height:40px}.hero .wrap{padding-top:76px}}
</style>

const fmt = v => Math.round(Math.abs(v)/1000).toLocaleString("en-US");
const pf = v => v===null||v===undefined ? "" : (Math.round(v/1000)===0 ? "-" : (v<0 ? `(${fmt(v)})` : fmt(v)));
const pc = p => p===null||!isFinite(p) ? "" : `<span class="pct">${(p*100).toFixed(1)}%</span>`;
const PAGES = [["bs","מאזן"],["comp","הרכבים"],["pl","רווח והפסד"],["eb","EBITDA"]];
const COMP_KEYS = D.comps.map(c=>c.key);
const isTot = l => /^סה"כ|^סך הכל|^רווח|^הפסד/.test(l) && !/^רווחי/.test(l);
const isKey = l => l==='סה"כ נכסים' || l==='סה"כ התחייבויות והון' || /לפני מס|נקי/.test(l);

function fsTable(rows, h1, h2){
  const head = `<thead><tr><th></th><th class="grp" colspan="3">${h1}</th><th class="gap"></th><th class="grp" colspan="3">מאוחד · השוואה</th></tr>
  <tr><th>סעיף</th><th>Nofar EV</th><th>אינובה</th><th class="cur">מאוחד</th><th class="gap"></th>${h2.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
  let body = "";
  rows.forEach((r,i)=>{
    const l = r[0], ci = COMP_KEYS.indexOf(l.replace("בשטית","בשיטת"));
    const drill = ci>=0 && rows===D.bs;
    const lbl = drill ? `<span class="car"></span>${l}` : l;
    const cls = (isKey(l) ? "key" : (isTot(l) ? "total" : "")) + (drill ? " drill" : "");
    body += `<tr class="${cls}"${drill?` tabindex="0" aria-expanded="false" data-d="${ci}"`:""}><td>${lbl}</td><td>${pf(r[1])}</td><td>${pf(r[2])}</td><td class="cur">${pf(r[3])}</td><td class="gap"></td><td class="cmp">${pf(r[4])}</td><td class="cmp">${pf(r[5])}</td><td class="cmp">${pf(r[6])}</td></tr>`;
    if (drill) body += detRows(D.comps[ci], ci);
    if (/^סה"כ (נכסים|הון עצמי|התחייבויות לא שוטפות|נכסים לא שוטפים)$|^סה"כ התחייבויות שוטפות$|^סה"כ נכסים שוטפים$/.test(l) && l!=='סה"כ התחייבויות והון') body += `<tr class="sp"><td colspan="8"></td></tr>`;
  });
  return `<div class="scroll"><table class="fs two">${head}<tbody>${body}</tbody></table></div>`;
}

function detRows(c, ci){
  const cell = (v, col) => [1,2,3].map(k=>`<td class="${k===3?"cur":""}">${k===col?pf(v):""}</td>`).join("") + `<td class="gap"></td><td></td><td></td><td></td>`;
  const tr = (lbl, v, cls, col) => `<tr class="det ${cls||""}" data-p="${ci}" hidden><td><span>${lbl}</span></td>${cell(v, 3)}</tr>`;
  if (c.groups) return c.groups.map((g,gi)=>{ const t = g.rows.reduce((a,r)=>a+r[1],0), col = gi===0?1:2;
    return `<tr class="det dg" data-p="${ci}" hidden><td><span>${g.name}</span></td>${[1,2,3].map(k=>`<td class="${k===3?"cur":""}">${k===col||k===3?pf(t):""}</td>`).join("")}<td class="gap"></td><td></td><td></td><td></td></tr>`
      + g.rows.map(r=>tr(r[0], r[1], "ds")).join(""); }).join("");
  return c.rows.slice().sort((a,b)=>b[1]-a[1]).map(r=>tr(r[0], r[1])).join("");
}
function toggleDet(row){
  const open = row.getAttribute("aria-expanded")!=="true";
  row.setAttribute("aria-expanded", open);
  document.querySelectorAll(`tr.det[data-p="${row.dataset.d}"]`).forEach(t=>t.hidden=!open);
}
document.addEventListener("click", e=>{ const r = e.target.closest("tr.drill"); if (r) toggleDet(r); });
document.addEventListener("keydown", e=>{ const r = e.target.closest && e.target.closest("tr.drill"); if (r && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); toggleDet(r); } });
function compCard(c, i){
  let rows = "", total = 0;
  const all = c.groups ? c.groups.flatMap(g=>g.rows) : c.rows;
  const gsum = rs => rs.reduce((a,r)=>a+r[1],0);
  total = c.groups ? c.groups.reduce((a,g)=>a+gsum(g.rows),0) : gsum(c.rows);
  const mx = Math.max(...all.map(r=>Math.abs(r[1])));
  const line = (r, cls, share) => `<tr class="${cls||""}"><td><span>${r[0]}</span><span class="bar${r[1]<0?" neg":""}" style="width:${Math.max(2,Math.abs(r[1])/mx*100)}%"></span></td><td>${pf(r[1])}</td><td class="p">${share?pc(r[1]/total):""}</td></tr>`;
  if (c.groups) c.groups.forEach(g=>{ rows += `<tr class="g"><td>${g.name}</td><td>${pf(gsum(g.rows))}</td><td class="p"></td></tr>`; g.rows.forEach(r=> rows += line(r,"g2")); });
  else c.rows.slice().sort((a,b)=>b[1]-a[1]).forEach(r=> rows += line(r,"",true));
  return `<section class="comp" id="comp-${i}"><h2>${c.key}</h2><div class="tot"><span>יתרה מאוחדת 30/09/2026 · אלפי ₪</span><b>${pf(total)}</b></div><div class="scroll"><table><tbody>${rows}</tbody></table></div></section>`;
}

function ebPage(){
  const E = D.eb, R = E.rows, C = E.cost||[];
  const add = (a,b) => (a===null||a===undefined)&&(b===null||b===undefined) ? null : (a||0)+(b||0);
  const tri = r => [r[1], r[2], add(r[1], r[2])];
  const PAIR = {"הכנסות מהקמה":"עלות הקמות","הכנסות מחשמל (חשמל + רווח)":"עלות חשמל וחלוקת רווחים","הכנסות מתחזוקה (דמי ניהול)":"עלות תחזוקה"};
  const NAME = {"הכנסות מהקמה":"הקמה","הכנסות מתחזוקה (דמי ניהול)":"תחזוקה (דמי ניהול)","הכנסות מחשמל (חשמל + רווח)":"חשמל (חשמל + רווח)","שירותי הנהלת חשבונות":"שירותי הנהלת חשבונות"};
  const row = (lbl, v, cls, pcts) => `<tr class="${cls||""}"><td>${lbl}</td>${v.map((x,i)=>`<td class="${i===2?"cur":""}">${pf(x)}${pcts?pc(pcts[i]):""}</td>`).join("")}</tr>`;
  const sumCols = rs => [0,1,2].map(i => rs.reduce((a,r)=>add(a,r[i]),null));
  const revT = sumCols(R.map(tri)), costT = sumCols(C.map(tri)), gp = revT.map((v,i)=>add(v,costT[i]));
  const ga = E.ga ? tri(E.ga) : [null,null,null], ebitda = gp.map((v,i)=>add(v,ga[i]));
  const div = (a,b) => a===null||!b ? null : a/b;
  let body = "";
  R.forEach(r=>{
    const rv = tri(r), c = C.find(x=>x[0]===PAIR[r[0]]), cv = c ? tri(c) : [null,null,null], g = rv.map((v,i)=>add(v,cv[i]));
    body += `<tr class="seg"><td colspan="4">${NAME[r[0]]||r[0]}</td></tr>`;
    body += row('<span class="sub">הכנסות</span>', rv);
    if (c) body += row('<span class="sub">עלות</span>', cv);
    body += row("רווח גולמי", g, "total", g.map((v,i)=>div(v,rv[i])));
  });
  C.filter(c=>!Object.values(PAIR).includes(c[0])).forEach(c=>{ body += `<tr class="seg"><td colspan="4">עלויות שלא שויכו למגזר</td></tr>` + row(`<span class="sub">${c[0]}</span>`, tri(c)); });
  body += `<tr class="sp"><td colspan="4"></td></tr>`;
  body += row('סה"כ הכנסות', revT, "total");
  body += row("רווח גולמי", gp, "total", gp.map((v,i)=>div(v,revT[i])));
  if (E.ga) body += row(`<span class="sub">${E.ga[0]}</span>`, ga, "", ga.map((v,i)=>div(-v,revT[i])));
  body += row("EBITDA", ebitda, "key", ebitda.map((v,i)=>div(v,revT[i])));
  const tile = (k, v, s, cur) => `<div class="tile${cur?" cur":""}"><div class="k">${k}</div><div class="v">${pf(v)}</div><div class="s">${s}</div></div>`;
  const tiles = `<div class="tiles">${tile("EBITDA · Nofar EV", ebitda[0], "רווח גולמי "+pf(gp[0]))}${tile("EBITDA · אינובה", ebitda[1], "רווח גולמי "+pf(gp[1]))}${tile("EBITDA · מאוחד", ebitda[2], "רווח גולמי "+pf(gp[2]), true)}</div>`;
  return tiles + `<section><h2>EBITDA לפי מגזר <small>${E.period} · לפני מע"מ · אלפי ₪</small></h2><div class="scroll"><table class="fs" style="min-width:760px"><thead><tr><th>מגזר</th><th>Nofar EV</th><th>אינובה</th><th class="cur">מאוחד</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
}

function render(){
  const h = location.hash.slice(1).split("/"), page = PAGES.some(p=>p[0]===h[0]) ? h[0] : "bs";
  document.getElementById("tabs").innerHTML = PAGES.map(([k,n])=>`<button data-p="${k}" ${k===page?'aria-current="page"':""}>${n}</button>`).join("");
  document.getElementById("h1").textContent = PAGES.find(p=>p[0]===page)[1];
  const q = document.querySelector(".hero .q");
  const m = document.getElementById("main");
  if (page==="bs"){ q.innerHTML = "<i></i>30/09/2026 · אלפי ₪"; m.innerHTML = `<section><h2>מאזן <small>אלפי ₪</small></h2>${fsTable(D.bs, "30/09/2026", ["31/12/2025","30/09/2025","תנועה Q3/26"])}</section>`; }
  if (page==="pl"){ q.innerHTML = "<i></i>ינואר–ספטמבר 2026 · אלפי ₪"; m.innerHTML = `<section><h2>רווח והפסד <small>אלפי ₪</small></h2>${fsTable(D.pl, "ינואר–ספטמבר 2026", ["ינואר–ספטמבר 2025","שנת 2025","Q3/26"])}</section>`; }
  if (page==="comp"){ q.innerHTML = "<i></i>מאוחד · 30/09/2026 · אלפי ₪"; m.innerHTML = `<div class="comps">${D.comps.map(compCard).join("")}</div>`;
    if (h[1]!==undefined){ const el = document.getElementById("comp-"+h[1]); if (el) el.scrollIntoView({block:"start"}); } }
  if (page==="eb"){ q.innerHTML = `<i></i>${D.eb.period} · אלפי ₪`; m.innerHTML = ebPage(); }
}
document.getElementById("tabs").addEventListener("click", e=>{ const b = e.target.closest("button"); if (b){ location.hash = b.dataset.p; window.scrollTo(0,0); } });
window.addEventListener("hashchange", render);
render();
